[package]
name = "artflow-minidesk"
version = "0.1.0"
description = "ArtFlow miniDesk — local-first commission desk for a single illustrator"
edition = "2021"
rust-version = "1.90"
default-run = "artflow-minidesk"

[lib]
name = "minidesk"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.43.0", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
fs2 = "0.4.3"
sha2 = "0.11.1"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
zip = { version = "9.6.0", default-features = false, features = ["deflate"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10"
iana-time-zone = "0.1"

[dev-dependencies]
tempfile = "3.27.0"

[[bin]]
name = "minidesk-probe"
path = "src/bin/minidesk_probe.rs"
