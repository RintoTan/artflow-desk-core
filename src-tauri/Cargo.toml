[package]
name = "artflow-minidesk"
version = "0.1.2"
description = "ArtFlow Desk Core — local-first commission desk for a single illustrator"
edition = "2021"
rust-version = "1.90"
default-run = "artflow-minidesk"

[lib]
name = "minidesk"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.43.0", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
fs2 = "0.4.3"
sha2 = "0.11.1"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
zip = { version = "9.6.0", default-features = false, features = ["deflate"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10"
iana-time-zone = "0.1"

[dev-dependencies]
tempfile = "3.27.0"
glob = "0.3"

# 开发 / 测试专用程序（探针与 QA 种子）只在显式打开 devtools 特性时构建。
# 不加这个开关时，`tauri build` 会把它们一起编出来并拷进 .app/Contents/MacOS，
# 正式包因此多出约 13.6MB 的测试程序。需要它们时用：cargo test --features devtools
[features]
devtools = []

[[bin]]
name = "minidesk-probe"
path = "src/bin/minidesk_probe.rs"
required-features = ["devtools"]

[[bin]]
name = "attachments-probe"
path = "src/bin/attachments_probe.rs"
required-features = ["devtools"]

[[bin]]
name = "qa_seed"
path = "src/bin/qa_seed.rs"
required-features = ["devtools"]

# Windows 的锁身份校验需要 GetFileInformationByHandle（卷序号 + 文件索引）。
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Pipes",
    "Win32_System_IO",
] }
