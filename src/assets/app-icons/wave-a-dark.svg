 <linearGradient id="right" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#84CBFB"/><stop offset="1" stop-color="#B9B0FF"/></linearGradient>
 <linearGradient id="wave" x1="0" y1="0.5" x2="1" y2="0.5"><stop stop-color="#FCFCFF"/><stop offset="0.5" stop-color="#B4D3FF"/><stop offset="1" stop-color="#D4C2FF"/></linearGradient>
</defs>
<rect x="12" y="12" width="488" height="488" rx="112" fill="url(#bg)"/>
