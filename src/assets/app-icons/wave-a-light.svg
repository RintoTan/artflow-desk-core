 <linearGradient id="wave" x1="0" y1="0.5" x2="1" y2="0.5"><stop stop-color="#2F6FAE"/><stop offset="0.5" stop-color="#5B8FC8"/><stop offset="1" stop-color="#7A6BC4"/></linearGradient>
</defs>
